services:
  - type: web
    name: brew-crave-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/clock
    envVars:
      - key: CAFE_ALLOWED_ORIGINS
        value: https://cafebillingsystem.netlify.app
      - key: CAFE_COOKIE_SECURE
        value: "true"
      - key: CAFE_COOKIE_SAMESITE
        value: Lax

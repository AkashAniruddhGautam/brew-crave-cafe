services:
  - type: web
    name: brew-crave-api
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/clock
    disk:
      name: brew-crave-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: CAFE_DATA_DIR
        value: /var/data
      - key: CAFE_ALLOWED_ORIGINS
        sync: false
      - key: CAFE_ALLOWED_HOSTS
        value: brew-crave-api.onrender.com
      - key: CAFE_COOKIE_SECURE
        value: "true"
      - key: CAFE_COOKIE_SAMESITE
        value: Lax
